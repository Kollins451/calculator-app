<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kollins Calculator</title>

  <link rel="stylesheet" href="/calculator-app/style.css">
  <link rel="manifest" href="/calculator-app/manifest.json">

  <meta name="theme-color" content="#222222">
</head>

<body>

  <div class="calculator">

    <input
      type="text"
      id="display"
      placeholder="0"
      readonly
    >

    <div class="buttons">

      <button class="clear">C</button>
      <button class="delete">⌫</button>
      <button class="operator">÷</button>
      <button class="operator">×</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">−</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">+</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="equals">=</button>

      <button>0</button>
      <button class="decimal">.</button>

    </div>

  </div>

  <script src="/calculator-app/script.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/calculator-app/sw.js")
          .then(() => {
            console.log("Service Worker registered successfully!");
          })
          .catch((error) => {
            console.log("Service Worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
