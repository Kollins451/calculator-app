<!-- =========================================
     KOLLINS AI
========================================= -->

<section
  id="ai-mode"
  class="calculator-mode"
>

  <div class="ai-header">

    <h2>🤖 Kollins AI</h2>

    <p>
      Ask me anything. I can help with
      mathematics, school subjects, coding,
      general questions, writing, and more.
    </p>

  </div>


  <!-- AI Chat Messages -->

  <div
    id="ai-chat"
    class="ai-chat"
  >

    <div class="ai-message">
      <strong>Kollins AI:</strong>

      <p>
        Hello! 👋 I'm Kollins AI.
        Ask me a question and I'll do my best
        to help you.
      </p>
    </div>

  </div>


  <!-- AI Input -->

  <div class="ai-input-area">

    <textarea
      id="ai-input"
      placeholder="Ask Kollins AI anything..."
      rows="3"
    ></textarea>

    <button
      id="ai-send"
      class="ai-send-button"
      type="button"
    >
      Send
    </button>

  </div>


  <!-- Clear Chat -->

  <button
    id="ai-clear"
    class="ai-clear-button"
    type="button"
  >
    Clear Chat
  </button>

</section>
